name: Build Flutter APK
​on:
push:
branches: [ main ]
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
​steps:
- name: Checkout Repository
uses: actions/checkout@v4
​- name: Set up Java
uses: actions/setup-java@v4
with:
distribution: 'zulu'
java-version: '17'
​- name: Set up Flutter
uses: subosito/flutter-action@v2
with:
channel: 'stable'
​- name: Recreate Android Project Files
run: |
rm -rf android build .dart_tool
flutter create --project-name fashion_app --org com.fashion .
sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
​- name: Get Dependencies
run: flutter pub get
​- name: Build APK (Debug Mode)
run: flutter build apk --debug
​- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: Fashion-App
path: build/app/outputs/flutter-apk/app-debug.apk
